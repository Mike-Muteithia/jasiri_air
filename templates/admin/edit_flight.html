{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 800px;">
        <div class="card-header bg-warning text-dark fw-bold">Edit Flight: {{ flight.flight_number }}</div>
        <div class="card-body p-4">
            <form action="{{ url_for('edit_flight', flight_id=flight.flight_id) }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Flight Number</label>
                        <input type="text" name="flight_number" class="form-control text-uppercase" value="{{ flight.flight_number }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Airline Name</label>
                        <input type="text" name="airline_name" class="form-control" value="{{ flight.airline_name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Departure City</label>
                        <input type="text" name="departure_city" class="form-control" value="{{ flight.departure_city }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Destination City</label>
                        <input type="text" name="destination_city" class="form-control" value="{{ flight.destination_city }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Departure Date</label>
                        <input type="date" name="departure_date" class="form-control" value="{{ flight.departure_date }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Departure Time</label>
                        <input type="time" name="departure_time" class="form-control" value="{{ flight.departure_time }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Arrival Time</label>
                        <input type="time" name="arrival_time" class="form-control" value="{{ flight.arrival_time }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Travel Class</label>
                        <select name="travel_class" class="form-select" required>
                            <option value="Economy" {% if flight.travel_class == 'Economy' %}selected{% endif %}>Economy</option>
                            <option value="Business" {% if flight.travel_class == 'Business' %}selected{% endif %}>Business</option>
                            <option value="First Class" {% if flight.travel_class == 'First Class' %}selected{% endif %}>First Class</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Ticket Price (KSh)</label>
                        <input type="number" step="0.01" name="ticket_price" class="form-control" value="{{ flight.ticket_price }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Total Seats</label>
                        <input type="number" name="total_seats" class="form-control" value="{{ flight.total_seats }}" required>
                    </div>
                </div>
                <div class="mt-4 text-end">
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-warning fw-bold">Update Flight</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
